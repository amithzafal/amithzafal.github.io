         <span data-anim=\"\" style=\"width:8px; height:8px; border-radius:50%; background:#35e0d4; box-shadow:0 0 12px #35e0d4; animation:azaPulse 2.6s ease-in-out infinite;\"><\u002Fspan>\n          Epigenetic Oscillator\n        <\u002Fdiv>\n        <h1 data-intro=\"\" style=\"opacity:0; transform:translateY(18px); margin:20px 0 0; font-family:'Space Grotesk'; font-weight:600; font-size:clamp(2.9rem,9.2vw,7.4rem); line-height:0.92; letter-spacing:-0.03em; color:#f3f6fc; text-shadow:0 0 44px rgba(53,224,212,0.14);\">Amith Zafal<br>Abdulla<\u002Fh1>\n        <div data-intro=\"\" style=\"opacity:0; transform:translateY(18px); margin-top:24px; font-family:'IBM Plex Mono'; font-size:clamp(12px,2.5vw,15px); letter-spacing:0.05em; color:#aeb7cc;\">HFSP Postdoctoral Fellow <span style=\"color:#35e0d4;\">·<\u002Fspan> Brandeis University<\u002Fdiv>\n        <p data-intro=\"\" style=\"opacity:0; transform:translateY(18px); margin:26px 0 0; max-width:660px; font-size:clamp(15px,2.1vw,19px); line-height:1.65; color:#c3ccde;\">Simulating chromosome territories, engineering the dynamics of epigenetic states at the single-cell level, and turning the folding genome into something we can <span style=\"color:#35e0d4;\">compute<\u002Fspan> and <span style=\"color:#35e0d4;\">predict<\u002Fspan>.<\u002Fp>\n        <div data-intro=\"\" style=\"opacity:0; transform:translateY(18px); display:flex; gap:14px; flex-wrap:wrap; margin-top:34px;\">\n          <a href=\"#research\" style=\"display:inline-flex; align-items:center; gap:10px; font-family:'IBM Plex Mono'; font-size:13px; letter-spacing:0.05em; color:#062018; background:#35e0d4; border:1px solid #35e0d4; padding:13px 22px; border-radius:4px; transition:transform .25s, box-shadow .25s;\" style-hover=\"box-shadow:0 0 32px rgba(53,224,212,0.4); transform:translateY(-2px);\">Explore the research →<\u002Fa>\n          <a href=\"#connect\" style=\"display:inline-flex; align-items:center; gap:10px; font-family:'IBM Plex Mono'; font-size:13px; letter-spacing:0.05em; color:#d5deec; background:transparent; border:1px solid rgba(255,255,255,0.18); padding:13px 22px; border-radius:4px; transition:border-color .25s, color .25s;\" style-hover=\"border-color:#35e0d4; color:#eafffb;\">Get in touch<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position:absolute; left:clamp(20px,5vw,64px); bottom:24px; z-index:3; font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:0.14em; color:#59657f; display:flex; gap:16px; flex-wrap:wrap; align-items:center; max-width:70vw;\">\n        <span style=\"display:inline-flex; align-items:center; gap:7px;\"><span data-anim=\"\" style=\"width:6px; height:6px; border-radius:50%; background:#35e0d4; box-shadow:0 0 8px #35e0d4; animation:azaPulse 2.4s ease-in-out infinite;\"><\u002Fspan>SIM · RUNNING<\u002Fspan>\n        <span>LOCI <span data-hud=\"n\" style=\"color:#8fb6c9;\">128<\u002Fspan><\u002Fspan>\n        <span>STEP <span data-hud=\"step\" style=\"color:#8fb6c9;\">000000<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div aria-hidden=\"true\" style=\"position:absolute; left:50%; transform:translateX(-50%); bottom:22px; z-index:3; display:flex; flex-direction:column; align-items:center; gap:8px;\">\n        <span style=\"font-family:'IBM Plex Mono'; font-size:10px; letter-spacing:0.3em; text-transform:uppercase; color:#6b7793;\">Scroll<\u002Fspan>\n        <span data-anim=\"\" style=\"width:1px; height:34px; background:linear-gradient(#35e0d4, transparent); animation:azaCue 2.2s ease-in-out infinite;\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"research\" data-spy=\"\" data-screen-label=\"Research Vision\" style=\"position:relative; padding:clamp(90px,13vh,160px) clamp(20px,5vw,64px);\">\n      <div style=\"max-width:1180px; margin:0 auto;\">\n        <div data-reveal=\"\" style=\"display:flex; align-items:center; gap:14px; margin-bottom:34px;\">\n          <span style=\"font-family:'IBM Plex Mono'; font-size:12px; letter-spacing:0.2em; color:#35e0d4;\">02<\u002Fspan>\n          <span style=\"height:1px; width:44px; background:linear-gradient(90deg,#35e0d4,transparent);\"><\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono'; font-size:12px; letter-spacing:0.28em; text-transform:uppercase; color:#8b95ad;\">Research vision<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:clamp(32px,5vw,72px); align-items:start;\">\n          <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px);\">\n            <h2 style=\"font-family:'Space Grotesk'; font-weight:500; font-size:clamp(2rem,4.8vw,3.5rem); line-height:1.03; letter-spacing:-0.02em; color:#eef1f8; margin:0;\">From observing life<br>to simulating it.<\u002Fh2>\n            <div style=\"display:flex; align-items:center; gap:12px; margin-top:26px; font-family:'IBM Plex Mono'; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:#6f7a93;\">\n              <span style=\"width:26px; height:1px; background:#35e0d4;\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); max-width:62ch;\">\n            <p style=\"margin:0; font-size:clamp(15px,1.9vw,18px); line-height:1.75; color:#c3ccde;\"> I'm a physicist turned computational biologist who builds mechanistic models of genome regulation and is now experimentally constructing synthetic epigenetic systems to test those models at single-cell resolution. Blending molecular biology with computational modeling to understand the coupling between chromatin folding, epigenetics and gene regulation.<\u002Fp>\n            <p style=\"margin:22px 0 0; font-size:clamp(15px,1.9vw,18px); line-height:1.75; color:#aab3c8;\">From modeling chromatin to collective behavior in active matter, I'm fundamentally fascinated by the physics of biological systems: the simple rules that let matter organize itself into something alive, remembering, and capable of change.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-reveal=\"\" style=\"opacity:0; transform:translateY(18px); display:flex; align-items:center; gap:12px; margin-top:clamp(50px,7vw,90px); font-family:'IBM Plex Mono'; font-size:11.5px; letter-spacing:0.24em; text-transform:uppercase; color:#8b95ad;\">\n          <span style=\"width:26px; height:1px; background:#35e0d4;\"><\u002Fspan>Current projects\n        <\u002Fdiv>\n\n        <div data-reveal=\"\" style=\"opacity:0; transform:translateY(24px); position:relative; overflow:hidden; margin-top:clamp(18px,2.4vw,26px); border:1px solid rgba(53,224,212,0.22); border-radius:8px; background:linear-gradient(180deg, rgba(53,224,212,0.055), rgba(255,255,255,0.012)); padding:clamp(28px,4vw,48px);\">\n          <div aria-hidden=\"true\" style=\"position:absolute; top:-40%; right:-8%; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle, rgba(53,224,212,0.14), transparent 65%); pointer-events:none;\"><\u002Fdiv>\n          <div style=\"position:relative; display:flex; align-items:flex-start; gap:clamp(14px,3vw,30px);\">\n            <span style=\"font-family:'IBM Plex Mono'; font-size:13px; color:#35e0d4; padding-top:calc(clamp(1.7rem,3.6vw,2.6rem) * 0.19 - 4.25px);\">01<\u002Fspan>\n            <h3 style=\"font-family:'Space Grotesk'; font-weight:600; font-size:clamp(1.7rem,3.6vw,2.6rem); line-height:1.05; letter-spacing:-0.02em; color:#f3f6fc; margin:0;\">The Epigenetic Oscillator<\u002Fh3>\n          <\u002Fdiv>\n          <p style=\"position:relative; margin:20px 0 0; max-width:64ch; font-size:clamp(15px,1.9vw,18px); line-height:1.7; color:#c3ccde;\">With Jane Kondev and Kaushik Ragunathan at Brandeis University, I'm building an epigenetic oscillator by engineering cell states, developing biophysical models of how epigenetic states are written, remembered, and erased, asking whether we can program a cell's memory of its own identity. Creating epigenetic patterns using noise in the system!<\u002Fp>\n          <div style=\"position:relative; display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin-top:30px;\">\n            <a href=\"https://doi.org/10.52044/HFSP.LT00202024-L.pc.gr.194709\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex; align-items:center; gap:10px; font-family:'IBM Plex Mono'; font-size:12.5px; letter-spacing:0.05em; color:#062018; background:#35e0d4; padding:12px 20px; border-radius:4px; transition:box-shadow .25s, transform .25s;\" style-hover=\"box-shadow:0 0 30px rgba(53,224,212,0.4); transform:translateY(-2px);\">View the HFSP project ↗<\u002Fa>\n            <span style=\"font-family:'IBM Plex Mono'; font-size:11.5px; letter-spacing:0.12em; color:#7f8aa3;\">Jane Kondev · Kaushik Ragunathan · Brandeis University<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-stagger=\"\" style=\"margin-top:clamp(30px,4vw,44px);\">\n          <div data-reveal=\"\" style=\"opacity:0; transform:translateY(18px); display:grid; grid-template-columns:60px 1fr; gap:clamp(14px,3vw,30px); align-items:start; padding:clamp(18px,2.4vw,26px) 8px; border-top:1px solid rgba(255,255,255,0.08); color:#eef1f8;\">\n            <span style=\"font-family:'IBM Plex Mono'; font-size:13px; color:#35e0d4; padding-top:3px;\">02<\u002Fspan>\n            <span>\n              <span style=\"display:block; font-family:'Space Grotesk'; font-weight:500; font-size:clamp(16px,2.2vw,20px); line-height:1.35; letter-spacing:-0.01em;\">Exploring the interplay of loop extrusion and topology changing enzymes, and their effect on chromosome organization<\u002Fspan>\n              <span style=\"display:block; margin-top:6px; font-family:'IBM Plex Mono'; font-size:12px; letter-spacing:0.06em; color:#7f8aa3;\">Chromatin folding &amp; the 3D genome<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div data-reveal=\"\" style=\"opacity:0; transform:translateY(18px); display:grid; grid-template-columns:60px 1fr; gap:clamp(14px,3vw,30px); align-items:start; padding:clamp(18px,2.4vw,26px) 8px; border-top:1px solid rgba(255,255,255,0.08); border-bottom:1px solid rgba(255,255,255,0.08); color:#eef1f8;\">\n            <span style=\"font-family:'IBM Plex Mono'; font-size:13px; color:#35e0d4; padding-top:3px;\">03<\u002Fspan>\n            <span>\n              <span style=\"display:block; font-family:'Space Grotesk'; font-weight:500; font-size:clamp(16px,2.2vw,20px); line-height:1.35; letter-spacing:-0.01em;\">How synthetic crosstalk circuits between epigenetic states can help in the long-term maintenance of heterochromatin domains<\u002Fspan>\n              <span style=\"display:block; margin-top:6px; font-family:'IBM Plex Mono'; font-size:12px; letter-spacing:0.06em; color:#7f8aa3;\">Synthetic circuits &amp; epigenetic memory<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"themes\" data-screen-label=\"Research Themes\" style=\"position:relative; padding:clamp(80px,11vh,140px) clamp(20px,5vw,64px);\">\n      <div style=\"max-width:1180px; margin:0 auto;\">\n        <div data-reveal=\"\" style=\"display:flex; align-items:center; gap:14px; margin-bottom:14px;\">\n          <span style=\"font-family:'IBM Plex Mono'; font-size:12px; letter-spacing:0.2em; color:#35e0d4;\">03<\u002Fspan>\n          <span style=\"height:1px; width:44px; background:linear-gradient(90deg,#35e0d4,transparent);\"><\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono'; font-size:12px; letter-spacing:0.28em; text-transform:uppercase; color:#8b95ad;\">Research themes<\u002Fspan>\n        <\u002Fdiv>\n        <h2 data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); font-family:'Space Grotesk'; font-weight:500; font-size:clamp(1.8rem,4vw,3rem); line-height:1.05; letter-spacing:-0.02em; color:#eef1f8; margin:0 0 clamp(36px,5vw,56px); max-width:20ch;\">Many threads, one question: how does physics organize life?<\u002Fh2>\n        <div style=\"position:relative;\"><canvas ref=\"{{ flowRef }}\" aria-hidden=\"true\" style=\"position:absolute; top:-24px; left:-24px; width:calc(100% + 48px); height:calc(100% + 48px); display:block; z-index:0; pointer-events:none;\"><\u002Fcanvas><div data-stagger=\"\" style=\"position:relative; z-index:1; display:grid; grid-template-columns:repeat(auto-fit, minmax(268px,1fr)); gap:clamp(14px,1.6vw,20px);\">\n\n          <div data-reveal=\"\" style=\"opacity:0; transform:translateY(22px); position:relative; overflow:hidden; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.07); border-radius:7px; padding:clamp(24px,3vw,32px); transition:transform .4s cubic-bezier(.22,.61,.36,1), border-color .4s, background .4s, box-shadow .4s;\" style-hover=\"transform:translateY(-5px); border-color:rgba(53,224,212,0.42); background:rgba(53,224,212,0.045); box-shadow:0 22px 55px -32px rgba(53,224,212,0.55);\">\n            <div aria-hidden=\"true\" style=\"position:absolute; top:12px; right:18px; font-family:'Space Grotesk'; font-weight:600; font-size:46px; line-height:1; color:rgba(255,255,255,0.05);\">01<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono'; font-size:10.5px; letter-spacing:0.22em; color:#35e0d4; margin-bottom:18px;\">EPIGENETICS<\u002Fdiv>\n            <h3 style=\"font-family:'Space Grotesk'; font-weight:500; font-size:clamp(1.1rem,2.2vw,1.4rem); line-height:1.15; letter-spacing:-0.01em; color:#eef1f8; margin:0 0 10px;\">Single-cell epigenetics &amp; memory<\u002Fh3>\n            <p style=\"margin:0; font-size:14.5px; line-height:1.6; color:#9aa4bb;\">How cells store, inherit, and sometimes forget cell states; How can we program cell states?<\u002Fp>\n          <\u002Fdiv>\n\n          <div data-reveal=\"\" style=\"opacity:0; transform:translateY(22px); position:relative; overflow:hidden; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.07); border-radius:7px; padding:clamp(24px,3vw,32px); transition:transform .4s cubic-bezier(.22,.61,.36,1), border-color .4s, background .4s, box-shadow .4s;\" style-hover=\"transform:translateY(-5px); border-color:rgba(53,224,212,0.42); background:rgba(53,224,212,0.045); box-shadow:0 22px 55px -32px rgba(53,224,212,0.55);\">\n            <div aria-hidden=\"true\" style=\"position:absolute; top:12px; right:18px; font-family:'Space Grotesk'; font-weight:600; font-size:46px; line-height:1; color:rgba(255,255,255,0.05);\">02<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono'; font-size:10.5px; letter-spacing:0.22em; color:#35e0d4; margin-bottom:18px;\">MODELING<\u002Fdiv>\n            <h3 style=\"font-family:'Space Grotesk'; font-weight:500; font-size:clamp(1.1rem,2.2vw,1.4rem); line-height:1.15; letter-spacing:-0.01em; color:#eef1f8; margin:0 0 10px;\">Chromatin folding &amp; the 3D genome<\u002Fh3>\n            <p style=\"margin:0; font-size:14.5px; line-height:1.6; color:#9aa4bb;\">Chromosome territories and the effect of topological constraints on folded chromatin.<\u002Fp>\n          <\u002Fdiv>\n\n          <div data-reveal=\"\" style=\"opacity:0; transform:translateY(22px); position:relative; overflow:hidden; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.07); border-radius:7px; padding:clamp(24px,3vw,32px); transition:transform .4s cubic-bezier(.22,.61,.36,1), border-color .4s, background .4s, box-shadow .4s;\" style-hover=\"transform:translateY(-5px); border-color:rgba(53,224,212,0.42); background:rgba(53,224,212,0.045); box-shadow:0 22px 55px -32px rgba(53,224,212,0.55);\">\n            <div aria-hidden=\"true\" style=\"position:absolute; top:12px; right:18px; font-family:'Space Grotesk'; font-weight:600; font-size:46px; line-height:1; color:rgba(255,255,255,0.05);\">03<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono'; font-size:10.5px; letter-spacing:0.22em; color:#35e0d4; margin-bottom:18px;\">REGULATION<\u002Fdiv>\n            <h3 style=\"font-family:'Space Grotesk'; font-weight:500; font-size:clamp(1.1rem,2.2vw,1.4rem); line-height:1.15; letter-spacing:-0.01em; color:#eef1f8; margin:0 0 10px;\">Gene regulation &amp; epigenomic landscapes<\u002Fh3>\n            <p style=\"margin:0; font-size:14.5px; line-height:1.6; color:#9aa4bb;\">How the folded genome and 1D information on histones conspire to switch genes on and off.<\u002Fp>\n          <\u002Fdiv>\n\n          <div data-reveal=\"\" style=\"opacity:0; transform:translateY(22px); position:relative; overflow:hidden; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.07); border-radius:7px; padding:clamp(24px,3vw,32px); transition:transform .4s cubic-bezier(.22,.61,.36,1), border-color .4s, background .4s, box-shadow .4s;\" style-hover=\"transform:translateY(-5px); border-color:rgba(53,224,212,0.42); background:rgba(53,224,212,0.045); box-shadow:0 22px 55px -32px rgba(53,224,212,0.55);\">\n            <div aria-hidden=\"true\" style=\"position:absolute; top:12px; right:18px; font-family:'Space Grotesk'; font-weight:600; font-size:46px; line-height:1; color:rgba(255,255,255,0.05);\">04<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono'; font-size:10.5px; letter-spacing:0.22em; color:#35e0d4; margin-bottom:18px;\">SYNTHETIC BIOLOGY<\u002Fdiv>\n            <h3 style=\"font-family:'Space Grotesk'; font-weight:500; font-size:clamp(1.1rem,2.2vw,1.4rem); line-height:1.15; letter-spacing:-0.01em; color:#eef1f8; margin:0 0 10px;\">Synthetic circuits<\u002Fh3>\n            <p style=\"margin:0; font-size:14.5px; line-height:1.6; color:#9aa4bb;\">Design and implement synthetic epigenetic circuits manipulating cell states to evolve specific functionalities.<\u002Fp>\n          <\u002Fdiv>\n\n          <div data-reveal=\"\" style=\"opacity:0; transform:translateY(22px); position:relative; overflow:hidden; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.07); border-radius:7px; padding:clamp(24px,3vw,32px); transition:transform .4s cubic-bezier(.22,.61,.36,1), border-color .4s, background .4s, box-shadow .4s;\" style-hover=\"transform:translateY(-5px); border-color:rgba(53,224,212,0.42); background:rgba(53,224,212,0.045); box-shadow:0 22px 55px -32px rgba(53,224,212,0.55);\">\n            <div aria-hidden=\"true\" style=\"position:absolute; top:12px; right:18px; font-family:'Space Grotesk'; font-weight:600; font-size:46px; line-height:1; color:rgba(255,255,255,0.05);\">05<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono'; font-size:10.5px; letter-spacing:0.22em; color:#35e0d4; margin-bottom:18px;\">ACTIVE MATTER<\u002Fdiv>\n            <h3 style=\"font-family:'Space Grotesk'; font-weight:500; font-size:clamp(1.1rem,2.2vw,1.4rem); line-height:1.15; letter-spacing:-0.01em; color:#eef1f8; margin:0 0 10px;\">The physics of living systems<\u002Fh3>\n            <p style=\"margin:0; font-size:14.5px; line-height:1.6; color:#9aa4bb;\">Collective behavior, from swarming bacteria to self-organizing living matter.<\u002Fp>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"publications\" data-spy=\"\" data-screen-label=\"Publications\" style=\"position:relative; padding:clamp(90px,13vh,160px) clamp(20px,5vw,64px);\">\n      <div style=\"max-width:1080px; margin:0 auto;\">\n        <div data-reveal=\"\" style=\"display:flex; align-items:center; gap:14px; margin-bottom:14px;\">\n          <span style=\"font-family:'IBM Plex Mono'; font-size:12px; letter-spacing:0.2em; color:#35e0d4;\">04<\u002Fspan>\n          <span style=\"height:1px; width:44px; background:linear-gradient(90deg,#35e0d4,transparent);\"><\u002Fspan>\n          \n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); display:flex; align-items:baseline; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:clamp(24px,4vw,40px);\">\n          <h2 style=\"font-family:'Space Grotesk'; font-weight:500; font-size:clamp(1.8rem,4vw,3rem); line-height:1.05; letter-spacing:-0.02em; color:#eef1f8; margin:0;\">Selected publications<\u002Fh2>\n          \n        <\u002Fdiv>\n\n        <div data-stagger=\"\">\n          <a href=\"https://pubs.acs.org/doi/abs/10.1021/acs.macromol.3c01182\" target=\"_blank\" rel=\"noopener noreferrer\" data-reveal=\"\" style=\"opacity:0; transform:translateY(18px); display:grid; grid-template-columns:60px 1fr auto; gap:clamp(14px,3vw,30px); align-items:start; padding:clamp(18px,2.4vw,26px) 8px; border-top:1px solid rgba(255,255,255,0.08); color:#eef1f8; transition:color .3s, background .3s;\" style-hover=\"color:#8af5ec; background:rgba(53,224,212,0.04);\">\n            <span style=\"font-family:'IBM Plex Mono'; font-size:13px; color:#35e0d4; padding-top:3px;\">2023<\u002Fspan>\n            <span>\n              <span style=\"display:block; font-family:'Space Grotesk'; font-weight:500; font-size:clamp(16px,2.2vw,20px); line-height:1.35; letter-spacing:-0.01em;\">Topological constraints and finite-size effects in quantitative polymer models of chromatin organization<\u002Fspan>\n              <span style=\"display:block; margin-top:6px; font-family:'IBM Plex Mono'; font-size:12px; letter-spacing:0.06em; color:#7f8aa3;\">Macromolecules<\u002Fspan>\n            <\u002Fspan>\n            <span aria-hidden=\"true\" style=\"font-size:18px; padding-top:3px;\">↗<\u002Fspan>\n          <\u002Fa>\n          <a href=\"https://pubmed.ncbi.nlm.nih.gov/36893485/\" target=\"_blank\" rel=\"noopener noreferrer\" data-reveal=\"\" style=\"opacity:0; transform:translateY(18px); display:grid; grid-template-columns:60px 1fr auto; gap:clamp(14px,3vw,30px); align-items:start; padding:clamp(18px,2.4vw,26px) 8px; border-top:1px solid rgba(255,255,255,0.08); color:#eef1f8; transition:color .3s, background .3s;\" style-hover=\"color:#8af5ec; background:rgba(53,224,212,0.04);\">\n            <span style=\"font-family:'IBM Plex Mono'; font-size:13px; color:#35e0d4; padding-top:3px;\">2023<\u002Fspan>\n            <span>\n              <span style=\"display:block; font-family:'Space Grotesk'; font-weight:500; font-size:clamp(16px,2.2vw,20px); line-height:1.35; letter-spacing:-0.01em;\">4D epigenomics: deciphering the coupling between genome folding and epigenomic regulation with biophysical modeling<\u002Fspan>\n              <span style=\"display:block; margin-top:6px; font-family:'IBM Plex Mono'; font-size:12px; letter-spacing:0.06em; color:#7f8aa3;\">Current Opinion in Genetics &amp; Development<\u002Fspan>\n            <\u002Fspan>\n            <span aria-hidden=\"true\" style=\"font-size:18px; padding-top:3px;\">↗<\u002Fspan>\n          <\u002Fa>\n          <a href=\"https://academic.oup.com/nar/article/50/16/9083/6677333\" target=\"_blank\" rel=\"noopener noreferrer\" data-reveal=\"\" style=\"opacity:0; transform:translateY(18px); display:grid; grid-template-columns:60px 1fr auto; gap:clamp(14px,3vw,30px); align-items:start; padding:clamp(18px,2.4vw,26px) 8px; border-top:1px solid rgba(255,255,255,0.08); color:#eef1f8; transition:color .3s, background .3s;\" style-hover=\"color:#8af5ec; background:rgba(53,224,212,0.04);\">\n            <span style=\"font-family:'IBM Plex Mono'; font-size:13px; color:#35e0d4; padding-top:3px;\">2022<\u002Fspan>\n            <span>\n              <span style=\"display:block; font-family:'Space Grotesk'; font-weight:500; font-size:clamp(16px,2.2vw,20px); line-height:1.35; letter-spacing:-0.01em;\">Painters in chromatin: a unified quantitative framework to characterize epigenome regulation and memory<\u002Fspan>\n              <span style=\"display:block; margin-top:6px; font-family:'IBM Plex Mono'; font-size:12px; letter-spacing:0.06em; color:#7f8aa3;\">Nucleic Acids Research<\u002Fspan>\n            <\u002Fspan>\n            <span aria-hidden=\"true\" style=\"font-size:18px; padding-top:3px;\">↗<\u002Fspan>\n          <\u002Fa>\n          <a href=\"https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1010450\" target=\"_blank\" rel=\"noopener noreferrer\" data-reveal=\"\" style=\"opacity:0; transform:translateY(18px); display:grid; grid-template-columns:60px 1fr auto; gap:clamp(14px,3vw,30px); align-items:start; padding:clamp(18px,2.4vw,26px) 8px; border-top:1px solid rgba(255,255,255,0.08); color:#eef1f8; transition:color .3s, background .3s;\" style-hover=\"color:#8af5ec; background:rgba(53,224,212,0.04);\">\n            <span style=\"font-family:'IBM Plex Mono'; font-size:13px; color:#35e0d4; padding-top:3px;\">2022<\u002Fspan>\n            <span>\n              <span style=\"display:block; font-family:'Space Grotesk'; font-weight:500; font-size:clamp(16px,2.2vw,20px); line-height:1.35; letter-spacing:-0.01em;\">Dynamical modeling of the H3K27 epigenetic landscape in mouse embryonic stem cells<\u002Fspan>\n              <span style=\"display:block; margin-top:6px; font-family:'IBM Plex Mono'; font-size:12px; letter-spacing:0.06em; color:#7f8aa3;\">PLOS Computational Biology<\u002Fspan>\n            <\u002Fspan>\n            <span aria-hidden=\"true\" style=\"font-size:18px; padding-top:3px;\">↗<\u002Fspan>\n          <\u002Fa>\n          <a href=\"https://pubs.acs.org/doi/abs/10.1021/acs.langmuir.1c00370\" target=\"_blank\" rel=\"noopener noreferrer\" data-reveal=\"\" style=\"opacity:0; transform:translateY(18px); display:grid; grid-template-columns:60px 1fr auto; gap:clamp(14px,3vw,30px); align-items:start; padding:clamp(18px,2.4vw,26px) 8px; border-top:1px solid rgba(255,255,255,0.08); color:#eef1f8; transition:color .3s, background .3s;\" style-hover=\"color:#8af5ec; background:rgba(53,224,212,0.04);\">\n            <span style=\"font-family:'IBM Plex Mono'; font-size:13px; color:#35e0d4; padding-top:3px;\">2021<\u002Fspan>\n            <span>\n              <span style=\"display:block; font-family:'Space Grotesk'; lamp(20px,5vw,64px);\">\n      <div style=\"max-width:1180px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:22px; flex-wrap:wrap;\">\n        <div style=\"font-family:'IBM Plex Mono'; font-size:12.5px; letter-spacing:0.08em; color:#6b7793;\">Written between simulations © 2026 · AZA<\u002Fdiv>\n        <div style=\"display:flex; gap:22px; flex-wrap:wrap; font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:0.18em; text-transform:uppercase;\">\n          <a href=\"#home\" style=\"color:#98a2b9;\" style-hover=\"color:#8af5ec;\">Home<\u002Fa>\n          <a href=\"#research\" style=\"color:#98a2b9;\" style-hover=\"color:#8af5ec;\">Research<\u002Fa>\n          <a href=\"#publications\" style=\"color:#98a2b9;\" style-hover=\"color:#8af5ec;\">Publications<\u002Fa>\n          <a href=\"#connect\" style=\"color:#98a2b9;\" style-hover=\"color:#8af5ec;\">Connect<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffooter>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: 900},\n  &quot;livingHero&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Motion&quot;, &quot;label&quot;: &quot;Living hero animation&quot;},\n  &quot;loopExtrusion&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Motion&quot;, &quot;label&quot;: &quot;Loop extrusion (SMC)&quot;},\n  &quot;motion&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Restrained&quot;, &quot;options&quot;: [&quot;Restrained&quot;, &quot;Lush&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Motion&quot;, &quot;label&quot;: &quot;Motion intensity&quot;},\n  &quot;magenta&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Rare&quot;, &quot;options&quot;: [&quot;Rare&quot;, &quot;Balanced&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Palette&quot;, &quot;label&quot;: &quot;Domain density&quot;}\n}\">\nclass Component extends DCLogic {\n  heroRef = React.createRef();\n  flowRef = React.createRef();\n  rootRef = React.createRef();\n\n  renderVals() {\n    return { heroRef: this.heroRef, flowRef: this.flowRef, rootRef: this.rootRef };\n  }\n\n  componentDidMount() {\n    const root = this.rootRef.current;\n    this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n    const p = this.props || {};\n    this.opt = {\n      living: p.livingHero !== false,\n      motion: p.motion || 'Restrained',\n      magenta: p.magenta || 'Rare',\n      loop: p.loopExtrusion !== false\n    };\n    if (root) {\n      this._hudStep = root.querySelector('[data-hud=\"step\"]');\n      this._hudN = root.querySelector('[data-hud=\"n\"]');\n    }\n    try { this.initHero(); } catch (e) { console.warn('hero', e); }\n    try { this.initFlow(); } catch (e) { console.warn('flow', e); }\n    try { this.initIntro(); } catch (e) {}\n    try { this.initReveals(); } catch (e) {}\n    try { this.initSpy(); } catch (e) {}\n    try { this.initNav(); } catch (e) {}\n    try { this.initEmail(); } catch (e) {}\n    try { this.killAnimIfReduced(); } catch (e) {}\n  }\n\n  componentWillUnmount() {\n    if (this._heroStop) this._heroStop();\n    if (this._flowStop) this._flowStop();\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n  }\n\n  killAnimIfReduced() {\n    if (!this.reduce) return;\n    const root = this.rootRef.current; if (!root) return;\n    root.querySelectorAll('[data-anim]').forEach(el => { el.style.animation = 'none'; });\n  }\n\n  initIntro() {\n    /* Intro entrance is now handled by pure CSS ([data-intro] + @keyframes azaIntro),\n       so it survives template re-streams and works without JS. No-op kept for call safety. */\n    return;\n  }\n\n  initReveals() {\n    const root = this.rootRef.current; if (!root) return;\n    const els = root.querySelectorAll('[data-reveal]');\n    root.querySelectorAll('[data-stagger]').forEach(g => {\n      let i = 0;\n      Array.prototype.forEach.call(g.children, c => {\n        if (c.matches && c.matches('[data-reveal]')) { c.style.transitionDelay = (i * 0.07) + 's'; i++; }\n      });\n    });\n    if (this.reduce) { els.forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; }); return; }\n    // Progressive enhancement: everything starts visible, so content can never be stranded\n    // invisible if the document's frame loop is throttled. Only once a real frame runs do we\n    // hide what is below the fold and animate it in on approach.\n    els.forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; });\n    requestAnimationFrame(() => {\n      const vh = window.innerHeight || document.documentElement.clientHeight;\n      els.forEach(el => {\n        const r = el.getBoundingClientRect();\n        if (r.top < vh * 0.92) return;                       // already in view: leave it shown\n        el.style.transition = 'none';\n        el.style.opacity = '0';\n        el.style.transform = 'translateY(20px)';\n        void el.offsetHeight;\n        el.style.transition = 'opacity .7s cubic-bezier(.22,.61,.36,1), transform .7s cubic-bezier(.22,.61,.36,1)';\n        const h = {};\n        h.off = this.watch(el, 0.12, () => {\n          el.style.opacity = '1'; el.style.transform = 'none';\n          setTimeout(() => { if (parseFloat(getComputedStyle(el).opacity) < 0.99) { el.style.transition = 'none'; el.style.opacity = '1'; el.style.transform = 'none'; } }, 1100);\n          if (h.off) h.off();\n        });\n      });\n    });\n  }\n\n  // rAF/scroll based visibility watcher: IntersectionObserver does not fire inside the\n  // single-file bundled document, so viewport tests go through here instead.\n  watch(el, ratio, onIn, onOut) {\n    let inside = null, self = null;\n    const check = () => {\n      const r = el.getBoundingClientRect();\n      const vh = window.innerHeight || document.documentElement.clientHeight;\n      const vw = window.innerWidth || document.documentElement.clientWidth;\n      const ih = Math.min(r.bottom, vh) - Math.max(r.top, 0);\n      const iw = Math.min(r.right, vw) - Math.max(r.left, 0);\n      const area = (r.width * r.height) || 1;\n      const vis = ih > 0 && iw > 0 ? (ih * iw) / area : 0;\n      const on = vis >= ratio || (ih > 0 && iw > 0 && r.height > vh * 0.9);\n      if (on === inside) return;\n      inside = on;\n      if (on) { if (onIn) onIn(); } else if (onOut) onOut();\n    };\n    if (!this._watchers) {\n      this._watchers = [];\n      const run = () => { this._wlast = Date.now(); this._watchers.slice().forEach(f => { try { f(); } catch (e) {} }); };\n      this._kick = () => {\n        const now = Date.now();\n        if (now - (this._wlast || 0) < 60) { clearTimeout(this._wt); this._wt = setTimeout(run, 70); return; }\n        run();\n      };\n      window.addEventListener('scroll', this._kick, { passive: true });\n      window.addEventListener('resize', this._kick);\n      this._watchTimer = setInterval(this._kick, 400);\n    }\n    this._watchers.push(check);\n    self = () => { const i = this._watchers.indexOf(check); if (i >= 0) this._watchers.splice(i, 1); };\n    check();\n    setTimeout(check, 250);\n    return self;\n  }\n\n  initSpy() {\n    const root = this.rootRef.current; if (!root) return;\n    const ids = ['home', 'research', 'publications', 'connect'];\n    const links = {};\n    ids.forEach(id => { links[id] = root.querySelector('[data-nav=\"' + id + '\"]'); });\n    let ticking = false;\n    const update = () => {\n      ticking = false;\n      const y = window.scrollY + 170; let cur = 'home';\n      ids.forEach(id => { const s = root.querySelector('#' + id); if (s) { const top = s.getBoundingClientRect().top + window.scrollY; if (top <= y) cur = id; } });\n      ids.forEach(id => { const a = links[id]; if (!a) return; const on = id === cur; a.style.color = on ? '#eef1f8' : '#98a2b9'; a.style.borderBottomColor = on ? '#35e0d4' : 'transparent'; });\n    };\n    this._onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    window.addEventListener('resize', this._onScroll);\n    update();\n  }\n\n  initEmail() {\n    const root = this.rootRef.current; if (!root) return;\n    const link = root.querySelector('[data-email]'); if (!link) return;\n    const addr = atob('YW1pdGh6YWZhbA==') + String.fromCharCode(64) + atob('YnJhbmRlaXMuZWR1');\n    const txt = link.querySelector('[data-email-text]');\n    if (txt) txt.textContent = addr;\n    const to = () => String.fromCharCode(109,97,105,108,116,111,58) + addr;\n    link.addEventListener('click', (e) => { e.preventDefault(); window.location.href = to(); });\n    link.addEventListener('auxclick', (e) => { if (e.button === 1) { e.preventDefault(); window.open(to()); } });\n    const arm = () => link.setAttribute('href', to());\n    const disarm = () => link.setAttribute('href', '#');\n    link.addEventListener('mouseenter', arm);\n    link.addEventListener('mouseleave', disarm);\n    link.addEventListener('focus', arm);\n    link.addEventListener('blur', disarm);\n  }\n\n  initNav() {\n    const root = this.rootRef.current; if (!root) return;\n    root.querySelectorAll('a[href^=\"#\"]:not([data-email])').forEach(a => {\n      a.addEventListener('click', (e) => {\n        const href = a.getAttribute('href'); if (!href || href === '#') return;\n        const t = root.querySelector(href);\n        if (t) { e.preventDefault(); const top = t.getBoundingClientRect().top + window.scrollY - 58; window.scrollTo({ top, behavior: this.reduce ? 'auto' : 'smooth' }); }\n      });\n    });\n  }\n\n  initHero() {\n    const canvas = this.heroRef.current; if (!canvas) return;\n    const ctx = canvas.getContext('2d'); if (!ctx) return;\n    const self = this; const opt = this.opt;\n    const CYAN = [53, 224, 212], MAG = [42, 111, 219];\n    let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 0, N = 120;\n    let beads = [];\n    const pointer = { x: 0, y: 0, active: false };\n    const lush = opt.motion === 'Lush';\n    const moreMag = opt.magenta === 'Balanced';\n\n    // ---- loop extrusion (SMC complexes) ----\n    const loopOn = opt.loop !== false;\n    let extruders = [];\n    function resetExtruder(ex) {\n      ex.c = 8 + Math.floor(Math.random() * Math.max(1, N - 16));\n      const room = Math.min(ex.c, N - 1 - ex.c);\n      const cap = Math.max(4, room - 1);\n      ex.wmax = Math.min(cap, 12 + Math.floor(Math.random() * 24));\n      ex.w = 1; ex.speed = 5.5 + Math.random() * 3.5;\n    }\n    function initExtruders() {\n      extruders = [];\n      if (!loopOn) return;\n      const n = Math.max(1, Math.min(3, Math.round(N / 55)));\n      for (let i = 0; i < n; i++) extruders.push({ phase: 'wait', timer: Math.random() * 2.5, alpha: 0, c: 0, w: 0, wmax: 0, speed: 6, ax: 0, ay: 0 });\n    }\n    function advanceExtruder(ex, dt) {\n      if (ex.phase === 'wait') { ex.alpha = 0; ex.timer -= dt; if (ex.timer <= 0) { resetExtruder(ex); ex.phase = 'extrude'; } return; }\n      if (ex.phase === 'extrude') { ex.alpha = Math.min(1, ex.alpha + dt * 6); ex.w += ex.speed * dt; if (ex.w >= ex.wmax) { ex.w = ex.wmax; ex.phase = 'hold'; ex.timer = 0.6 + Math.random() * 0.7; } return; }\n      if (ex.phase === 'hold') { ex.alpha = 1; ex.timer -= dt; if (ex.timer <= 0) ex.phase = 'release'; return; }\n      if (ex.phase === 'release') { ex.alpha -= dt * 1.5; if (ex.alpha <= 0) { ex.alpha = 0; ex.phase = 'wait'; ex.timer = 0.5 + Math.random() * 1.3; } return; }\n    }\n\n    function computeN() { let n = Math.round(W / 11); n = Math.max(70, Math.min(140, n)); if (lush) n = Math.min(185, Math.round(n * 1.3)); N = n; }\n    function build() {\n      beads = [];\n      for (let i = 0; i < N; i++) beads.push({ x: cx + (Math.random() - 0.5) * R * 1.4, y: cy + (Math.random() - 0.5) * R * 1.4, vx: 0, vy: 0, s: 0 });\n      const seeds = (moreMag ? 4 : 2) + Math.floor(Math.random() * (moreMag ? 3 : 2));\n      for (let k = 0; k < seeds; k++) {\n        const c = Math.floor(Math.random() * N); const w = (moreMag ? 10 : 6) + Math.floor(Math.random() * 10);\n        for (let i = -w; i <= w; i++) { const j = c + i; if (j >= 0 && j < N) { const v = (1 - Math.abs(i) / w) * (moreMag ? 1 : 0.9); if (v > beads[j].s) beads[j].s = v; } }\n      }\n      initExtruders();\n      if (self._hudN) self._hudN.textContent = String(N);\n    }\n    function resize() {\n      const r = canvas.getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height);\n      DPR = Math.min(window.devicePixelRatio || 1, 2);\n      canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n      cx = W * 0.70; cy = H * 0.5; R = Math.min(W, H) * 0.32;\n      computeN(); if (beads.length !== N) build();\n      ctx.fillStyle = '#070a14'; ctx.fillRect(0, 0, W, H);\n    }\n    function lerpC(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }\n    function colFor(s) { return lerpC(CYAN, MAG, Math.pow(Math.max(0, Math.min(1, s)), 1.25)); }\n    let t = 0, last = performance.now(), step = 0, running = false, raf = 0;\n    function physics(dt) {\n      const k1 = 1.4, k2 = 2.2, damp = 0.86;\n      for (let i = 0; i < N; i++) {\n        const b = beads[i]; const fi = i * 0.19;\n        const tx = cx + R * (Math.sin(fi + t * 0.16) + 0.55 * Math.sin(fi * 0.5 - t * 0.11) + 0.25 * Math.sin(fi * 1.7 + t * 0.23));\n        const ty = cy + R * (Math.cos(fi * 0.85 - t * 0.13) + 0.55 * Math.cos(fi * 0.4 + t * 0.09) + 0.25 * Math.cos(fi * 1.6 - t * 0.2));\n        let ax = (tx - b.x) * k1, ay = (ty - b.y) * k1; const p = beads[i - 1], q = beads[i + 1];\n        if (p && q) { ax += ((p.x + q.x) * 0.5 - b.x) * k2; ay += ((p.y + q.y) * 0.5 - b.y) * k2; }\n        else if (p) { ax += (p.x - b.x) * k2; ay += (p.y - b.y) * k2; }\n        else if (q) { ax += (q.x - b.x) * k2; ay += (q.y - b.y) * k2; }\n        if (pointer.active) { const dx = b.x - pointer.x, dy = b.y - pointer.y; const d2 = dx * dx + dy * dy; const rr = 205; if (d2 < rr * rr) { const d = Math.sqrt(d2) || 1; const e = 1 - d / rr; const f = e * e * 165; ax += dx / d * f; ay += dy / d * f; } }\n        b.vx = (b.vx + ax * dt) * damp; b.vy = (b.vy + ay * dt) * damp; b.x += b.vx * dt; b.y += b.vy * dt;\n      }\n      // loop extrusion: advance SMC state + cinch the two loop-base anchors together\n      for (let e = 0; e < extruders.length; e++) {\n        const ex = extruders[e]; advanceExtruder(ex, dt);\n        if (ex.alpha <= 0.001) continue;\n        const wi = Math.round(ex.w);\n        const a2 = Math.max(0, ex.c - wi), b2 = Math.min(N - 1, ex.c + wi);\n        if (a2 >= b2) continue;\n        const A = beads[a2], B = beads[b2];\n        const mx = (A.x + B.x) * 0.5, my = (A.y + B.y) * 0.5;\n        // position-based constraint: snap the two loop-base anchors together so the base is a tight pinch\n        const pull = 0.5 * ex.alpha;\n        A.x += (mx - A.x) * pull; A.y += (my - A.y) * pull;\n        B.x += (mx - B.x) * pull; B.y += (my - B.y) * pull;\n        const vmx = (A.vx + B.vx) * 0.5, vmy = (A.vy + B.vy) * 0.5;\n        A.vx += (vmx - A.vx) * pull; A.vy += (vmy - A.vy) * pull;\n        B.vx += (vmx - B.vx) * pull; B.vy += (vmy - B.vy) * pull;\n        ex.ax = (A.x + B.x) * 0.5; ex.ay = (A.y + B.y) * 0.5;\n      }\n    }\n    function draw() {\n      ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';\n      // contact lines (Hi-C feel): faint links between spatially close, non-adjacent loci\n      ctx.strokeStyle = 'rgba(96,196,214,0.05)'; ctx.lineWidth = 0.7;\n      const CT2 = 34 * 34;\n      for (let i = 0; i < N; i++) {\n        const a = beads[i];\n        for (let j = i + 5; j < N; j++) {\n          const b = beads[j]; const dx = a.x - b.x, dy = a.y - b.y; const dd = dx * dx + dy * dy;\n          if (dd < CT2) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }\n        }\n      }\n      for (let i = 1; i < N; i++) {\n        const a = beads[i - 1], b = beads[i]; const c = colFor((a.s + b.s) * 0.5);\n        const r = c[0] | 0, g = c[1] | 0, bl = c[2] | 0;\n        ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + bl + ',0.06)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();\n        ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + bl + ',0.5)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();\n      }\n      for (let i = 0; i < N; i++) {\n        const b = beads[i]; const c = colFor(b.s); const r = c[0] | 0, g = c[1] | 0, bl = c[2] | 0; const node = (i % 12 === 0);\n        ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + bl + ',0.92)'; ctx.beginPath(); ctx.arc(b.x, b.y, node ? 2.6 : 1.3, 0, 6.2832); ctx.fill();\n        if (node) { ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + bl + ',0.13)'; ctx.beginPath(); ctx.arc(b.x, b.y, 8.5, 0, 6.2832); ctx.fill(); }\n      }\n      // loop extrusion overlay: extruded loop strand + SMC complex ring at the loop base\n      for (let e = 0; e < extruders.length; e++) {\n        const ex = extruders[e]; if (ex.alpha <= 0.02) continue;\n        const wi = Math.round(ex.w);\n        const a2 = Math.max(0, ex.c - wi), b2 = Math.min(N - 1, ex.c + wi);\n        const al = ex.alpha;\n        ctx.strokeStyle = 'rgba(120,232,228,' + (0.3 * al).toFixed(3) + ')'; ctx.lineWidth = 2;\n        ctx.beginPath(); ctx.moveTo(beads[a2].x, beads[a2].y);\n        for (let i = a2 + 1; i <= b2; i++) ctx.lineTo(beads[i].x, beads[i].y);\n        ctx.stroke();\n        const A = beads[a2], B
